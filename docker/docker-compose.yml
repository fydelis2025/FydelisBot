services:
  bridge:
    build:
      context: ..                     # ← SOBE para a RAIZ do projeto!
      dockerfile: docker/bridge.Dockerfile  # ← caminho DESDE a raiz
    environment:
      - FYDELIS_BIND=0.0.0.0
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "ros2", "topic", "list"]
      interval: 5s
      timeout: 5s
      retries: 5

  gui:
    build:
      context: ..                     # ← mesma coisa: raiz
      dockerfile: docker/gui.Dockerfile
    depends_on:
      bridge:
        condition: service_healthy
    environment:
      - FYDELIS_HOST=bridge
      - DISPLAY=${DISPLAY}
      - GDK_BACKEND=x11
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix

